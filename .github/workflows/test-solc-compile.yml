name: Test Solidity Compiler Compilation

on:
  push:
    branches:
      - test-solc-compile
  pull_request:
    branches:
      - test-solc-compile

jobs:
  compile-solc:
    name: Compile Solidity Compiler on ARM
    runs-on: ubuntu-22.04-arm
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore solc cache (Linux ARM)
        id: cache-solc
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/solc/v0.8.29
          key: solc-${{ runner.os }}-${{ matrix.arch }}-v0-8-29
      
      - name: Compile solc from source (Linux ARM)
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake clang ninja-build ccache python3 z3 libz3-dev libboost-all-dev
          git clone --recursive --branch v0.8.29 https://github.com/ethereum/solidity.git solidity
          cd solidity
          mkdir build && cd build
          cmake .. && make -j$(nproc)
          mkdir -p ~/.cache/solc/v0.8.29/
          cp ./solc/solc ~/.cache/solc/v0.8.29/solc
      
      - name: Verify solc installation
        run: |
          ~/.cache/solc/v0.8.29/solc --version
          echo "Solidity compiler successfully compiled and cached"
